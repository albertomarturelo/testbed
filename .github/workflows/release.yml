# ADR 2026-10-20-release-process: the maintainer tags v<x.y.z> on main after the
# `chore(release)` PR; this workflow checks, packs, smoke-tests and publishes
# @casefile/core then @casefile/cli with provenance. A manual run, or a PR that
# touches packaging, is a dry run.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.mjs
      - packages/core/package.json
      - apps/cli/package.json
      - skills/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (ADR release-process §5)
    env:
      # Only a pushed tag publishes; a manual run is a dry run even on a tag ref.
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag must be on main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Check the tag
        if: env.PUBLISH == 'true'
        run: |
          node scripts/release.mjs check "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          (cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          ls -l "$RUNNER_TEMP/pack"
      - name: Smoke-test the packed CLI
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          test "$(./node_modules/.bin/casefile --version)" = "$version"
          mkdir app && cd app && git init -q
          ../node_modules/.bin/casefile init --skills-into .claude/skills
          test -f casefile.yaml
          test -f .claude/skills/qa-cover/SKILL.md
          grep -q "\"@casefile/cli\": \"$version\"" .casefile/package.json
      - name: Publish core, then the CLI
        env:
          # The token reaches the step only when it publishes.
          NODE_AUTH_TOKEN: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && secrets.NPM_TOKEN || '' }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          flags="--access public"
          if [ "$PUBLISH" = "true" ]; then flags="$flags --provenance"; else flags="$flags --dry-run"; fi
          for pkg in core cli; do
            # A rerun after a partial publish skips what npm already has.
            if [ "$PUBLISH" = "true" ] && npm view "@casefile/$pkg@$version" version > /dev/null 2>&1; then
              echo "@casefile/$pkg@$version is already on npm: skipped"
              continue
            fi
            npm publish "$RUNNER_TEMP"/pack/casefile-$pkg-*.tgz $flags
          done

  github-release:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
